name: hr-messenger

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
      POSTGRES_DB: hr
      TZ: Asia/Almaty
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hr"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    restart: unless-stopped

  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://hr:${POSTGRES_PASSWORD}@db:5432/hr
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  worker:
    build: ./backend
    command: ["arq", "app.worker.WorkerSettings"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://hr:${POSTGRES_PASSWORD}@db:5432/hr
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - api
    restart: unless-stopped

  # Песочница WhatsApp: эмулятор Cloud API + «телефон кандидата» (http://localhost:9000).
  # Для боевого режима: WA_API_BASE=https://graph.facebook.com в .env и запуск без профиля sandbox.
  wa-mock:
    build: ./backend
    profiles: ["sandbox"]
    command: ["uvicorn", "app.wamock.main:app", "--host", "0.0.0.0", "--port", "9000"]
    env_file: .env
    environment:
      MOCK_WEBHOOK_URL: http://api:8000/api/webhooks/whatsapp
    ports:
      - "${MOCK_PORT:-9000}:9000"
    restart: unless-stopped

  web:
    build: ./frontend
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
