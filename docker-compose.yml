name: hr-messenger

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
      POSTGRES_DB: hr
      TZ: Asia/Almaty
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hr"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    restart: unless-stopped

  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://hr:${POSTGRES_PASSWORD}@db:5432/hr
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  worker:
    build: ./backend
    command: ["arq", "app.worker.WorkerSettings"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://hr:${POSTGRES_PASSWORD}@db:5432/hr
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - api
    restart: unless-stopped

  # Песочница WhatsApp: эмулятор Cloud API + «телефон кандидата» (http://localhost:9000).
  # Для боевого режима: WA_API_BASE=https://graph.facebook.com в .env и запуск без профиля sandbox.
  wa-mock:
    build: ./backend
    profiles: ["sandbox"]
    command: ["uvicorn", "app.wamock.main:app", "--host", "0.0.0.0", "--port", "9000"]
    env_file: .env
    environment:
      MOCK_WEBHOOK_URL: http://api:8000/api/webhooks/whatsapp
    ports:
      - "${MOCK_PORT:-9000}:9000"
    restart: unless-stopped

  # Веб-интерфейс. Порт открыт только на самом сервере (127.0.0.1): снаружи вход через Caddy.
  # Для доступа с другого компьютера локальной сети без Caddy: WEB_BIND=0.0.0.0 в .env.
  web:
    build: ./frontend
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:80"
    depends_on:
      - api
    restart: unless-stopped

  # Боевой режим на сервере: HTTPS-прокси с автоматическим сертификатом Let's Encrypt.
  # Запуск: docker compose --profile prod up -d. Домен берётся из DOMAIN в .env.
  caddy:
    image: caddy:2-alpine
    profiles: ["prod"]
    environment:
      DOMAIN: ${DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  caddy_data:     # сертификаты HTTPS — не удалять, иначе Let's Encrypt может временно отказать в выдаче
  caddy_config:
